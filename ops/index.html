<!DOCTYPE html>
<html lang="ko-KR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0e14" />
  <title>플라이휠 OS · 관제</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="../shared/viewport.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <span class="brand-mark">⚡</span>
        <div class="brand-text">
          <h1>플라이휠 OS · 관제</h1>
          <span class="brand-sub">네이버 예약 · 키오스크 체크인</span>
        </div>
      </div>
      <div class="header-center">
        <div class="live-clock" id="clock">--:--:--</div>
        <div class="clock-meta">
          <span class="tz">Asia/Seoul</span>
          <span class="offset-badge" id="offsetBadge" hidden>오프셋 0분</span>
          <span class="demo-badge" id="demoBadge" hidden>데모 재생중</span>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="btn-demo" id="btnDemoToggle" aria-pressed="false">데모 시작</button>
        <nav class="header-links">
          <a href="../session/">세션 엔진</a>
          <a href="../kiosk/">키오스크</a>
          <a href="../">← 허브</a>
        </nav>
      </div>
    </header>

    <!-- KPI row -->
    <section class="kpi-row" aria-label="오늘 KPI">
      <article class="kpi-card">
        <span class="kpi-label">오늘 예약</span>
        <span class="kpi-value" id="kpiTotal">0</span>
      </article>
      <article class="kpi-card kpi-green">
        <span class="kpi-label">입장 완료</span>
        <span class="kpi-value" id="kpiCheckedIn">0</span>
      </article>
      <article class="kpi-card kpi-amber">
        <span class="kpi-label">대기(미입장)</span>
        <span class="kpi-value" id="kpiWaiting">0</span>
      </article>
      <article class="kpi-card kpi-red">
        <span class="kpi-label">노쇼</span>
        <span class="kpi-value" id="kpiNoShow">0</span>
      </article>
      <article class="kpi-card kpi-accent">
        <span class="kpi-label">현재 슬롯 잔여</span>
        <span class="kpi-value" id="kpiRemain">—</span>
      </article>
    </section>

    <div class="legend legend-slim" aria-label="범례">
      <span><i class="dot green"></i>입장</span>
      <span><i class="dot amber"></i>대기/예약</span>
      <span><i class="dot red"></i>노쇼</span>
      <span><i class="dot gray"></i>예정</span>
    </div>

    <!-- Main grid -->
    <div class="main-grid">
      <!-- Current slot -->
      <section class="panel current-slot" aria-label="현재 슬롯">
        <div class="panel-head">
          <h2>현재 슬롯</h2>
          <span class="slot-range" id="currentSlotRange">—</span>
        </div>
        <div class="capacity-row">
          <div class="capacity-meta">
            <span>정원 <strong id="capacityValue">—</strong></span>
            <span class="peak-badge" id="peakBadge">—</span>
            <span>입장 <strong id="checkedCount">0</strong></span>
            <span>잔여 <strong id="remainCount">—</strong></span>
            <span class="freed-badge" id="freedBadge" hidden>노쇼 해방 0</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div class="progress-fill" id="progressFill" style="width:0%"></div>
          </div>
        </div>
        <div class="booking-list" id="bookingList"></div>
      </section>

      <!-- Timeline -->
      <section class="panel timeline-panel" aria-label="오늘 타임라인">
        <div class="panel-head">
          <h2>오늘 타임라인</h2>
          <span class="hint">슬롯 클릭 → 포커스</span>
        </div>
        <div class="timeline" id="timeline"></div>
      </section>

      <!-- Shooting addon -->
      <section class="panel shooting-panel" aria-label="슈팅 애드온">
        <div class="panel-head">
          <h2>슈팅 애드온</h2>
          <span class="hint">동시 1명 · 대기열</span>
        </div>
        <div class="shooting-status" id="shootingStatus">
          <div class="shooting-now">
            <span class="label">사용중</span>
            <span class="value" id="shootingActive">없음</span>
          </div>
          <ol class="shooting-queue" id="shootingQueue"></ol>
        </div>
      </section>
    </div>

    <!-- Toast stack -->
    <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  </div>
  <script src="../shared/store.js"></script>
  <script src="../shared/viewport.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
