<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07070a" />
  <title>FLYWHEEL · CREW</title>
  <link rel="stylesheet" href="shared/viewport.css" />
  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");
    :root {
      --bg: #07070a;
      --ink: #f5f5f0;
      --mute: #9a9a92;
      --lime: #c8ff00;
      --pink: #ff2d6a;
      --yellow: #ffe600;
      --cyan: #2de2e6;
      --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); }
    body {
      background:
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.015) 2px, rgba(255,255,255,0.015) 3px),
        radial-gradient(ellipse at 0% 0%, rgba(200,255,0,0.12), transparent 40%),
        radial-gradient(ellipse at 100% 0%, rgba(255,45,106,0.14), transparent 42%),
        var(--bg);
    }
    .wrap {
      max-width: 960px; margin: 0 auto;
      padding: 3rem 1.2rem 2.5rem;
      padding-right: max(1.2rem, 7.5rem);
    }

    /* Hero poster strip */
    .hero {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem;
    }
    .brand-block { display: flex; flex-direction: column; gap: 0.35rem; }
    .sticker {
      display: inline-flex; align-self: flex-start;
      background: var(--lime); color: #07070a;
      font-weight: 900; font-size: 0.7rem; letter-spacing: 0.12em;
      padding: 0.28rem 0.55rem; transform: rotate(-2deg);
      border: 2px solid #07070a; box-shadow: 3px 3px 0 #ff2d6a;
    }
    h1 {
      font-size: clamp(2.1rem, 6vw, 3.4rem);
      font-weight: 900; line-height: 0.95; letter-spacing: -0.04em;
      text-transform: uppercase;
    }
    h1 span { color: var(--lime); }
    .tag {
      font-size: 0.85rem; font-weight: 800; color: var(--mute);
      letter-spacing: 0.02em;
    }
    .live {
      display: inline-flex; align-items: center; gap: 0.45rem;
      background: var(--pink); color: #fff; font-weight: 900; font-size: 0.75rem;
      letter-spacing: 0.14em; padding: 0.45rem 0.7rem;
      border: 2px solid #fff; transform: rotate(2deg);
      box-shadow: 3px 3px 0 var(--yellow);
    }
    .live i {
      width: 0.55rem; height: 0.55rem; border-radius: 50%; background: #fff;
      display: block; animation: blink 1s steps(2) infinite;
    }
    @keyframes blink { 50% { opacity: 0.25; } }

    /* KPI 3-up compact */
    .kpi-row {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.45rem;
      margin-bottom: 0.9rem;
    }
    .kpi {
      border: 2.5px solid #fff; padding: 0.5rem 0.4rem 0.55rem;
      text-align: center; min-width: 0;
      box-shadow: 3px 3px 0 #000;
    }
    .kpi.book { background: var(--cyan); color: #041018; }
    .kpi.in { background: var(--lime); color: #041018; }
    .kpi.ns { background: var(--pink); color: #fff; }
    .kpi-label { font-size: 0.65rem; font-weight: 900; letter-spacing: 0.08em; display: block; }
    .kpi-val { font-size: 1.6rem; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }

    /* Main board */
    .board {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      grid-template-areas:
        "crew kiosk ops"
        "crew session run";
      gap: 0.65rem;
    }
    .card {
      border: 2.5px solid #fff; color: inherit; text-decoration: none;
      padding: 1rem 0.9rem; min-width: 0; min-height: 120px;
      display: flex; flex-direction: column; gap: 0.4rem;
      box-shadow: 4px 4px 0 #000;
      transition: transform 0.12s, box-shadow 0.12s;
      position: relative;
    }
    a.card:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 #000; }
    .card-eyebrow {
      font-size: 0.65rem; font-weight: 900; letter-spacing: 0.14em;
      opacity: 0.8;
    }
    .card-title {
      font-size: 1.35rem; font-weight: 900; letter-spacing: -0.03em; line-height: 1.05;
    }
    .card-sub { font-size: 0.78rem; font-weight: 700; opacity: 0.8; line-height: 1.3; }
    .card-go {
      margin-top: auto; align-self: flex-start;
      font-size: 0.72rem; font-weight: 900; letter-spacing: 0.06em;
      background: #07070a; color: #fff; padding: 0.35rem 0.55rem;
    }

    .crew {
      grid-area: crew; background: var(--lime); color: #07070a;
      min-height: 240px;
      background-image:
        linear-gradient(135deg, transparent 40%, rgba(0,0,0,0.06) 40%, rgba(0,0,0,0.06) 42%, transparent 42%),
        linear-gradient(160deg, #c8ff00, #9fef00);
    }
    .crew .card-title { font-size: clamp(1.6rem, 3.5vw, 2.1rem); }
    .crew-avatars { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.35rem 0; }
    .crew-av {
      width: 2.5rem; height: 2.5rem; border-radius: 4px;
      display: grid; place-items: center; font-weight: 900; font-size: 0.8rem;
      border: 2px solid #07070a; color: #fff;
      box-shadow: 2px 2px 0 #07070a;
    }
    .crew-stat { margin-top: auto; display: flex; align-items: baseline; gap: 0.35rem; }
    .crew-stat strong { font-size: 2.2rem; line-height: 0.9; }
    .crew-stat span { font-size: 0.85rem; font-weight: 800; }

    .kiosk { grid-area: kiosk; background: var(--cyan); color: #041018; }
    .ops { grid-area: ops; background: var(--yellow); color: #07070a; }
    .session { grid-area: session; background: #7b5cff; color: #fff; }
    .run { grid-area: run; background: var(--pink); color: #fff; gap: 0.45rem; }
    .run .card-title { font-size: 1.2rem; }
    .act-btns { display: flex; flex-direction: column; gap: 0.4rem; margin-top: auto; }
    .act-btns button {
      appearance: none; border: 2px solid #07070a; cursor: pointer; font: inherit;
      font-weight: 900; min-height: 46px; padding: 0.5rem 0.65rem; font-size: 0.85rem;
      box-shadow: 2px 2px 0 #07070a;
    }
    .act-btns .seed { background: var(--lime); color: #07070a; }
    .act-btns .reset { background: #07070a; color: #fff; border-color: #fff; box-shadow: 2px 2px 0 var(--yellow); }

    .tape {
      margin-top: 1rem; display: flex; flex-wrap: wrap; gap: 0.4rem;
    }
    .tape span {
      font-size: 0.7rem; font-weight: 900; letter-spacing: 0.04em;
      padding: 0.4rem 0.65rem; border: 2px solid #fff; background: #121212;
      transform: rotate(-1deg);
    }
    .tape span:nth-child(even) { transform: rotate(1.5deg); background: #1a1a1a; }
    .tape em { font-style: normal; color: var(--lime); margin-right: 0.3rem; }

    footer {
      margin-top: 1.4rem; text-align: center;
      font-size: 0.68rem; font-weight: 700; color: var(--mute); letter-spacing: 0.06em;
    }

    html.force-mobile .kpi-row { grid-template-columns: repeat(3, 1fr) !important; }
    html.force-mobile .kpi-val { font-size: 1.3rem !important; }
    html.force-mobile .board {
      grid-template-columns: 1fr !important;
      grid-template-areas:
        "crew" "kiosk" "ops" "session" "run" !important;
    }
    /* fix: class name is board */
    html.force-mobile .board { display: grid; }
    html.force-mobile .wrap { padding-right: 1rem !important; padding-left: 1rem !important; }
    html.force-mobile h1 { font-size: 2rem !important; }
    html.force-mobile .crew { min-height: 200px; }

    @media (max-width: 720px) {
      .board {
        grid-template-columns: 1fr;
        grid-template-areas: "crew" "kiosk" "ops" "session" "run";
      }
      .wrap { padding-right: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="brand-block">
        <div class="sticker">STREET CREW OS</div>
        <h1>FLYWHEEL<br><span>CREW</span></h1>
        <p class="tag">혼자 와도 · 같이 돈다</p>
      </div>
      <div class="live" aria-label="라이브"><i></i>LIVE</div>
    </header>

    <section class="kpi-row" aria-label="오늘 현황">
      <div class="kpi book"><span class="kpi-label">예약</span><span class="kpi-val" id="kpiBookings">0</span></div>
      <div class="kpi in"><span class="kpi-label">입장</span><span class="kpi-val" id="kpiCheckins">0</span></div>
      <div class="kpi ns"><span class="kpi-label">노쇼</span><span class="kpi-val" id="kpiNoshow">0</span></div>
    </section>

    <section class="board" aria-label="메인">
      <a class="card crew" href="session/">
        <div class="card-eyebrow">CREW ZONE</div>
        <div class="card-title">크루 동반</div>
        <div class="card-sub">오프라인처럼 입장하고<br>같은 타이머로 같이 땀</div>
        <div class="crew-avatars" id="crewAvatars"></div>
        <div class="crew-stat"><strong id="crewCount">0</strong><span>명 ON</span></div>
      </a>

      <a class="card kiosk" href="kiosk/">
        <div class="card-eyebrow">CHECK-IN</div>
        <div class="card-title">키오스크</div>
        <div class="card-sub">번호로 바로 입장</div>
        <span class="card-go">GO →</span>
      </a>

      <a class="card ops" href="ops/">
        <div class="card-eyebrow">OPS</div>
        <div class="card-title">관제</div>
        <div class="card-sub">데모 한 방 · 슬롯</div>
        <span class="card-go">GO →</span>
      </a>

      <a class="card session" href="session/">
        <div class="card-eyebrow">SESSION</div>
        <div class="card-title">세션</div>
        <div class="card-sub">타이머 · 음성 · 링</div>
        <span class="card-go">GO →</span>
      </a>

      <div class="card run">
        <div class="card-eyebrow">QUICK</div>
        <div class="card-title">빠른 실행</div>
        <div class="act-btns">
          <button type="button" class="seed" id="btnSeed">데모 시드</button>
          <button type="button" class="reset" id="btnReset">초기화</button>
        </div>
      </div>
    </section>

    <div class="tape" aria-label="흐름">
      <span><em>01</em>예약</span>
      <span><em>02</em>입장</span>
      <span><em>03</em>관제</span>
      <span><em>04</em>세션</span>
    </div>

    <footer>FLYWHEEL OS · STREET CREW ENERGY</footer>
  </div>

  <script src="shared/store.js"></script>
  <script src="shared/viewport.js"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const COLORS = ["#ff2d6a", "#5b5bff", "#07070a", "#ff6a00", "#2de2e6", "#9b5de5"];
      const NAMES = ["민", "준", "하", "서", "윤", "지"];

      function renderCrew(n) {
        const box = $("crewAvatars");
        const count = Math.max(n, 4);
        box.innerHTML = "";
        for (let i = 0; i < Math.min(count, 6); i++) {
          const el = document.createElement("div");
          el.className = "crew-av";
          el.style.background = COLORS[i % COLORS.length];
          el.textContent = NAMES[i];
          box.appendChild(el);
        }
        $("crewCount").textContent = String(Math.max(n, 4));
      }

      function refresh() {
        FlywheelStore.ensureSeeded();
        const c = FlywheelStore.counts();
        $("kpiBookings").textContent = String(c.total);
        $("kpiCheckins").textContent = String(c.checkedIn);
        $("kpiNoshow").textContent = String(c.noshow);
        renderCrew(c.checkedIn || 0);
      }

      $("btnSeed").addEventListener("click", () => { FlywheelStore.seedDemo(); refresh(); });
      $("btnReset").addEventListener("click", () => {
        localStorage.removeItem(FlywheelStore.KEY);
        FlywheelStore.seedDemo();
        refresh();
      });
      FlywheelStore.subscribe(refresh);
      refresh();
      setInterval(refresh, 2000);
    })();
  </script>
</body>
</html>
