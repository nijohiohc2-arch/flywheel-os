<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07070a" />
  <title>FLYWHEEL · CREW</title>
  <link rel="stylesheet" href="shared/viewport.css" />
  <style>
    :root {
      --bg: #07070a;
      --ink: #f5f5f0;
      --mute: #9a9a92;
      --lime: #c8ff00;
      --pink: #ff2d6a;
      --yellow: #ffe600;
      --cyan: #2de2e6;
      --line: #fff;
      --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); }
    body {
      background:
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.015) 2px, rgba(255,255,255,0.015) 3px),
        radial-gradient(ellipse at 0% 0%, rgba(200,255,0,0.1), transparent 40%),
        radial-gradient(ellipse at 100% 0%, rgba(255,45,106,0.12), transparent 42%),
        var(--bg);
    }
    .wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 2.75rem 1.1rem 2rem;
      padding-right: max(1.1rem, 7.25rem);
    }

    /* Continuous outer frame top→bottom */
    .frame {
      border: 3px solid var(--line);
      box-shadow: 6px 6px 0 #000;
      background: #0c0c10;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.75rem 0.9rem;
      border-bottom: 3px solid var(--line);
      background: #0c0c10;
      min-width: 0;
    }
    .brand {
      display: flex; align-items: center; gap: 0.55rem; min-width: 0; flex: 1;
    }
    .sticker {
      flex: 0 0 auto;
      background: var(--lime); color: #07070a;
      font-weight: 900; font-size: 0.62rem; letter-spacing: 0.1em;
      padding: 0.22rem 0.45rem;
      border: 2px solid #07070a;
      white-space: nowrap;
    }
    h1 {
      font-size: clamp(1.15rem, 3.2vw, 1.65rem);
      font-weight: 900; letter-spacing: -0.03em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      line-height: 1;
    }
    h1 span { color: var(--lime); }
    .live {
      flex: 0 0 auto;
      display: inline-flex; align-items: center; gap: 0.35rem;
      background: var(--pink); color: #fff;
      font-weight: 900; font-size: 0.68rem; letter-spacing: 0.12em;
      padding: 0.35rem 0.55rem;
      border: 2px solid #fff;
      white-space: nowrap;
    }
    .live i {
      width: 0.45rem; height: 0.45rem; border-radius: 50%; background: #fff;
      display: block; animation: blink 1s steps(2) infinite;
    }
    @keyframes blink { 50% { opacity: 0.25; } }

    /* KPI strip — continuous with frame sides */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 3px solid var(--line);
    }
    .kpi {
      padding: 0.45rem 0.35rem;
      text-align: center;
      min-width: 0;
      border-right: 3px solid var(--line);
    }
    .kpi:last-child { border-right: none; }
    .kpi.book { background: var(--cyan); color: #041018; }
    .kpi.in { background: var(--lime); color: #041018; }
    .kpi.ns { background: var(--pink); color: #fff; }
    .kpi-label {
      font-size: 0.62rem; font-weight: 900; letter-spacing: 0.08em;
      display: block; white-space: nowrap;
    }
    .kpi-val {
      font-size: 1.35rem; font-weight: 900; line-height: 1.1;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }

    /* Board — shared borders, no gaps (continuous lines) */
    .board {
      display: grid;
      grid-template-columns: 1.35fr 1fr 1fr;
      grid-template-areas:
        "crew kiosk ops"
        "crew session run";
    }
    .card {
      color: inherit; text-decoration: none;
      padding: 0.7rem 0.75rem;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      justify-content: center;
      border-right: 3px solid var(--line);
      border-bottom: 3px solid var(--line);
    }
    .card-eyebrow {
      font-size: 0.58rem; font-weight: 900; letter-spacing: 0.12em;
      white-space: nowrap; opacity: 0.75;
    }
    .card-title {
      font-size: 1.05rem; font-weight: 900; letter-spacing: -0.02em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      line-height: 1.15;
    }
    .card-sub {
      font-size: 0.72rem; font-weight: 700; opacity: 0.8;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      line-height: 1.2;
    }
    .card-go {
      margin-top: 0.35rem; align-self: flex-start;
      font-size: 0.65rem; font-weight: 900; letter-spacing: 0.06em;
      background: #07070a; color: #fff; padding: 0.28rem 0.45rem;
      white-space: nowrap;
    }

    .crew {
      grid-area: crew;
      background: linear-gradient(160deg, #c8ff00, #9fef00);
      color: #07070a;
      border-right: 3px solid var(--line);
      border-bottom: none; /* spans 2 rows — bottom comes from grid edge */
      justify-content: flex-start;
      gap: 0.4rem;
      padding: 0.85rem 0.8rem;
    }
    /* crew is bottom-left of board: need bottom border from frame — add via board last row */
    .crew { border-bottom: 3px solid var(--line); }
    .crew .card-title { font-size: 1.35rem; }
    .crew-avatars { display: flex; flex-wrap: nowrap; gap: 0.3rem; overflow: hidden; }
    .crew-av {
      width: 2rem; height: 2rem; flex: 0 0 auto;
      display: grid; place-items: center; font-weight: 900; font-size: 0.7rem;
      border: 2px solid #07070a; color: #fff; background: #07070a;
    }
    .crew-stat {
      margin-top: auto; display: flex; align-items: baseline; gap: 0.3rem;
      white-space: nowrap;
    }
    .crew-stat strong { font-size: 1.75rem; line-height: 1; }
    .crew-stat span { font-size: 0.75rem; font-weight: 800; }

    .kiosk { grid-area: kiosk; background: var(--cyan); color: #041018; }
    .ops { grid-area: ops; background: var(--yellow); color: #07070a; border-right: none; }
    .session { grid-area: session; background: #7b5cff; color: #fff; }
    .run { grid-area: run; background: var(--pink); color: #fff; border-right: none; gap: 0.35rem; }

    .act-btns { display: flex; flex-direction: column; gap: 0.3rem; margin-top: 0.25rem; }
    .act-btns button {
      appearance: none; border: 2px solid #07070a; cursor: pointer; font: inherit;
      font-weight: 900; min-height: 40px; padding: 0.35rem 0.5rem; font-size: 0.78rem;
      white-space: nowrap;
    }
    .act-btns .seed { background: var(--lime); color: #07070a; }
    .act-btns .reset { background: #07070a; color: #fff; border-color: #fff; }

    .tape {
      display: flex; flex-wrap: nowrap; gap: 0;
      border-top: none;
      overflow: hidden;
    }
    .tape span {
      flex: 1;
      font-size: 0.68rem; font-weight: 900; letter-spacing: 0.04em;
      padding: 0.55rem 0.4rem; text-align: center;
      border-right: 3px solid var(--line);
      background: #121212;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tape span:last-child { border-right: none; }
    .tape em { font-style: normal; color: var(--lime); margin-right: 0.25rem; }

    footer {
      margin-top: 0.85rem; text-align: center;
      font-size: 0.65rem; font-weight: 700; color: var(--mute); letter-spacing: 0.06em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    html.force-mobile .wrap { padding-right: 1rem !important; padding-left: 1rem !important; }
    html.force-mobile .kpi-row { grid-template-columns: repeat(3, 1fr) !important; }
    html.force-mobile .board {
      grid-template-columns: 1fr !important;
      grid-template-areas: "crew" "kiosk" "ops" "session" "run" !important;
    }
    html.force-mobile .card,
    html.force-mobile .crew,
    html.force-mobile .ops,
    html.force-mobile .run {
      border-right: none !important;
    }
    html.force-mobile .card { border-bottom: 3px solid var(--line) !important; }
    html.force-mobile h1 { font-size: 1.15rem !important; }

    @media (max-width: 720px) {
      .board {
        grid-template-columns: 1fr;
        grid-template-areas: "crew" "kiosk" "ops" "session" "run";
      }
      .card, .crew, .ops, .run { border-right: none; }
      .wrap { padding-right: 1.1rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="frame">
      <header class="hero">
        <div class="brand">
          <div class="sticker">STREET CREW</div>
          <h1>FLYWHEEL <span>CREW</span></h1>
        </div>
        <div class="live" aria-label="라이브"><i></i>LIVE</div>
      </header>

      <section class="kpi-row" aria-label="오늘 현황">
        <div class="kpi book"><span class="kpi-label">예약</span><span class="kpi-val" id="kpiBookings">0</span></div>
        <div class="kpi in"><span class="kpi-label">입장</span><span class="kpi-val" id="kpiCheckins">0</span></div>
        <div class="kpi ns"><span class="kpi-label">노쇼</span><span class="kpi-val" id="kpiNoshow">0</span></div>
      </section>

      <section class="board" aria-label="메인">
        <a class="card crew" href="session/">
          <div class="card-eyebrow">CREW ZONE</div>
          <div class="card-title">크루 동반</div>
          <div class="card-sub">혼자 와도 같이 돈다</div>
          <div class="crew-avatars" id="crewAvatars"></div>
          <div class="crew-stat"><strong id="crewCount">0</strong><span>명 ON</span></div>
        </a>

        <a class="card kiosk" href="kiosk/">
          <div class="card-eyebrow">CHECK-IN</div>
          <div class="card-title">키오스크</div>
          <div class="card-sub">번호로 바로 입장</div>
          <span class="card-go">GO →</span>
        </a>

        <a class="card ops" href="ops/">
          <div class="card-eyebrow">OPS</div>
          <div class="card-title">관제</div>
          <div class="card-sub">데모 한 방 · 슬롯</div>
          <span class="card-go">GO →</span>
        </a>

        <a class="card session" href="session/">
          <div class="card-eyebrow">SESSION</div>
          <div class="card-title">세션</div>
          <div class="card-sub">타이머 · 음성 · 링</div>
          <span class="card-go">GO →</span>
        </a>

        <div class="card run">
          <div class="card-eyebrow">QUICK</div>
          <div class="card-title">빠른 실행</div>
          <div class="act-btns">
            <button type="button" class="seed" id="btnSeed">데모 시드</button>
            <button type="button" class="reset" id="btnReset">초기화</button>
          </div>
        </div>
      </section>

      <div class="tape" aria-label="흐름">
        <span><em>01</em>예약</span>
        <span><em>02</em>입장</span>
        <span><em>03</em>관제</span>
        <span><em>04</em>세션</span>
      </div>
    </div>

    <footer>FLYWHEEL OS · STREET CREW ENERGY</footer>
  </div>

  <script src="shared/store.js"></script>
  <script src="shared/viewport.js"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const COLORS = ["#ff2d6a", "#5b5bff", "#2de2e6", "#ff6a00", "#9b5de5", "#07070a"];
      const NAMES = ["민", "준", "하", "서", "윤", "지"];

      function renderCrew(n) {
        const box = $("crewAvatars");
        const count = Math.max(n, 4);
        box.innerHTML = "";
        for (let i = 0; i < Math.min(count, 6); i++) {
          const el = document.createElement("div");
          el.className = "crew-av";
          el.style.background = COLORS[i % COLORS.length];
          el.textContent = NAMES[i];
          box.appendChild(el);
        }
        $("crewCount").textContent = String(Math.max(n, 4));
      }

      function refresh() {
        FlywheelStore.ensureSeeded();
        const c = FlywheelStore.counts();
        $("kpiBookings").textContent = String(c.total);
        $("kpiCheckins").textContent = String(c.checkedIn);
        $("kpiNoshow").textContent = String(c.noshow);
        renderCrew(c.checkedIn || 0);
      }

      $("btnSeed").addEventListener("click", () => { FlywheelStore.seedDemo(); refresh(); });
      $("btnReset").addEventListener("click", () => {
        localStorage.removeItem(FlywheelStore.KEY);
        FlywheelStore.seedDemo();
        refresh();
      });
      FlywheelStore.subscribe(refresh);
      refresh();
      setInterval(refresh, 2000);
    })();
  </script>
</body>
</html>
