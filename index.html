<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0e14" />
  <title>플라이휠 OS · 허브</title>
  <link rel="stylesheet" href="shared/viewport.css" />
  <style>
    :root {
      --bg: #0a0e14;
      --bg-elev: #121820;
      --bg-card: #1a222d;
      --border: #2a3544;
      --text: #f0f4f8;
      --text-dim: #8b9aab;
      --accent: #00e5a0;
      --accent-dim: #00b87a;
      --amber: #ffb020;
      --red: #ff4d6a;
      --blue: #5b9dff;
      --radius: 14px;
      --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }
    body {
      background:
        radial-gradient(ellipse at 15% -10%, rgba(0, 229, 160, 0.1), transparent 45%),
        radial-gradient(ellipse at 90% 10%, rgba(91, 157, 255, 0.07), transparent 40%),
        var(--bg);
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      /* Clear fixed viewport toggle (top-right) */
      padding: 3.25rem 1.25rem 2.5rem;
      padding-right: max(1.25rem, 7.5rem);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.1rem;
      flex-wrap: wrap;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      color: var(--accent);
      font-size: 0.85rem;
    }
    .logo-mark {
      width: 1.85rem; height: 1.85rem;
      display: grid; place-items: center;
      border-radius: 0.45rem;
      background: linear-gradient(135deg, var(--accent), #1ec8ff);
      color: #04110a;
      font-size: 0.75rem;
    }
    .topbar h1 {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .dash {
      display: grid;
      gap: 0.75rem;
    }
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.65rem;
    }
    .kpi {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem 0.9rem;
      text-align: center;
      min-width: 0;
    }
    .kpi-label { font-size: 0.72rem; color: var(--text-dim); display: block; margin-bottom: 0.25rem; font-weight: 600; }
    .kpi-val { font-size: 1.75rem; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
    .kpi.book .kpi-val { color: var(--blue); }
    .kpi.in .kpi-val { color: var(--accent); }
    .kpi.ns .kpi-val { color: var(--red); }

    .tile-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.65rem;
    }
    .tile {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.9rem 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      min-width: 0;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    a.tile:hover {
      border-color: var(--accent-dim);
      box-shadow: 0 0 0 1px rgba(0, 229, 160, 0.15);
    }
    .tile-top {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .tile-ico { font-size: 1.2rem; line-height: 1; }
    .tile-title { font-size: 0.95rem; font-weight: 800; }
    .tile-sub {
      font-size: 0.72rem;
      color: var(--text-dim);
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .chip {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.45rem 0.75rem;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      min-height: 40px;
      transition: border-color 0.12s, color 0.12s, background 0.12s;
    }
    .chip:hover { border-color: var(--accent-dim); color: var(--accent); }
    .chip-num {
      width: 1.25rem; height: 1.25rem;
      border-radius: 50%;
      background: rgba(0, 229, 160, 0.18);
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 900;
      display: grid; place-items: center;
    }
    .chip.primary {
      background: linear-gradient(180deg, var(--accent), var(--accent-dim));
      color: #04140e;
      border-color: transparent;
    }
    .chip.primary:hover { filter: brightness(1.06); color: #04140e; }
    .chip.ghost { color: var(--text-dim); }

    .crew-tile {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, rgba(0, 229, 160, 0.08), rgba(91, 157, 255, 0.06));
      border-color: rgba(0, 229, 160, 0.35);
    }
    .crew-tile .tile-title { color: var(--accent); }

    footer {
      margin-top: 1.25rem;
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    @media (max-width: 720px) {
      .kpi-row, .tile-grid { grid-template-columns: 1fr; }
      .wrap { padding-right: 1.25rem; }
    }

    /* force-mobile: 1-col stack */
    html.force-mobile .kpi-row,
    html.force-mobile .tile-grid {
      grid-template-columns: 1fr !important;
    }
    html.force-mobile .crew-tile { grid-column: auto; }
    html.force-mobile .kpi-val { font-size: 1.5rem !important; }
    html.force-mobile .wrap {
      padding-top: 1.5rem !important;
      padding-right: 1rem !important;
      padding-left: 1rem !important;
    }
    html.force-mobile .chip { min-height: 44px; }
    html.force-mobile .tile-sub { white-space: normal; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="logo"><span class="logo-mark">FW</span> FLYWHEEL OS</div>
      <h1>연결 데모 허브</h1>
    </div>

    <div class="dash">
      <section class="kpi-row" aria-label="실시간 KPI">
        <div class="kpi book">
          <span class="kpi-label">예약</span>
          <span class="kpi-val" id="kpiBookings">0</span>
        </div>
        <div class="kpi in">
          <span class="kpi-label">입장</span>
          <span class="kpi-val" id="kpiCheckins">0</span>
        </div>
        <div class="kpi ns">
          <span class="kpi-label">노쇼</span>
          <span class="kpi-val" id="kpiNoshow">0</span>
        </div>
      </section>

      <section class="tile-grid" aria-label="대시보드">
        <a class="tile" href="kiosk/">
          <div class="tile-top"><span class="tile-ico">📱</span><span class="tile-title">키오스크</span></div>
          <div class="tile-sub">번호 체크인</div>
        </a>
        <a class="tile" href="ops/">
          <div class="tile-top"><span class="tile-ico">🖥️</span><span class="tile-title">관제</span></div>
          <div class="tile-sub">KPI · 슬롯 · 데모</div>
        </a>
        <a class="tile" href="session/">
          <div class="tile-top"><span class="tile-ico">⏱️</span><span class="tile-title">세션</span></div>
          <div class="tile-sub">타이머 · 링 · 음성</div>
        </a>

        <article class="tile crew-tile" aria-label="크루">
          <div class="tile-top"><span class="tile-ico">👥</span><span class="tile-title">크루 동반</span></div>
          <div class="tile-sub">세션 스크린 · 가상 크루 · 순간 오버레이</div>
        </article>
      </section>

      <div class="chip-row" aria-label="플로우">
        <span class="chip" aria-hidden="true"><span class="chip-num">1</span>예약</span>
        <span class="chip" aria-hidden="true"><span class="chip-num">2</span>입장</span>
        <span class="chip" aria-hidden="true"><span class="chip-num">3</span>관제</span>
        <span class="chip" aria-hidden="true"><span class="chip-num">4</span>세션</span>
      </div>

      <div class="chip-row" aria-label="액션">
        <button type="button" class="chip primary" id="btnSeed">데모 예약 시드</button>
        <button type="button" class="chip ghost" id="btnReset">전체 초기화</button>
      </div>
    </div>

    <footer>플라이휠 OS v0 · nijohiohc2-arch/flywheel-os · GitHub Pages</footer>
  </div>

  <script src="shared/store.js"></script>
  <script src="shared/viewport.js"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      function refresh() {
        FlywheelStore.ensureSeeded();
        const c = FlywheelStore.counts();
        $("kpiBookings").textContent = String(c.total);
        $("kpiCheckins").textContent = String(c.checkedIn);
        $("kpiNoshow").textContent = String(c.noshow);
      }
      $("btnSeed").addEventListener("click", () => {
        FlywheelStore.seedDemo();
        refresh();
      });
      $("btnReset").addEventListener("click", () => {
        localStorage.removeItem(FlywheelStore.KEY);
        FlywheelStore.seedDemo();
        refresh();
      });
      FlywheelStore.subscribe(refresh);
      refresh();
      setInterval(refresh, 2000);
    })();
  </script>
</body>
</html>
